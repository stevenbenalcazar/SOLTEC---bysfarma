<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SOLTEC | Alertas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <div class="logo-container">
            <img src="assets/logo.png" alt="SOLTEC Innovación">
        </div>
    
        <nav class="menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="inventario.html">Inventario</a>
            <a href="alertas.html">Alertas</a>
            <a href="chatbot.html">Chatbot IA</a>
            <a href="usuarios.html" id="link-usuarios">Usuarios</a> 
            <a href="index.html" class="logout" onclick="logout()">Salir</a>
        </nav>
    </aside>    

    <main class="content">
        <h1>Alertas del Sistema</h1>
        <input 
            type="text"
            id="busquedaAlertas"
            placeholder="Buscar alerta..."
            onkeyup="buscarAlertas()">

        <div class="card">
            <h3>Productos en alerta</h3>
        
            <table class="tabla-alertas">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>fecha de caducidad</th>
                        <th>Stock actual</th>
                        <th>Estado</th>
                        <th>Acción</th>
                        </tr>
                </thead>
                <tbody id="contenedorAlertas"></tbody>
            </table>
        </div>            
    </main>
</div>

<script src="js/app.js"></script>
<script>
    cargarAlertas();
</script>

</body>
</html>

<div id="modalReponer" class="modal">
    <div class="modal-content">
      <h3>Actualizar producto</h3>
  
      <input type="number" id="nuevoStock" placeholder="Nuevo stock">
      <input type="date" id="nuevaFecha">
  
      <textarea id="observacion" placeholder="¿Qué acción se tomó?"></textarea>
  
      <button onclick="confirmarReponer()">Guardar</button>
      <button onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>
