<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SOLTEC | Inventario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <div class="logo-container">
            <img src="assets/logo.png" alt="SOLTEC Innovación">
        </div>
    
        <nav class="menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="inventario.html">Inventario</a>
            <a href="alertas.html">Alertas</a>
            <a href="chatbot.html">Chatbot IA</a>
            <a href="usuarios.html" id="link-usuarios">Usuarios</a> 
            <a href="index.html" class="logout" onclick="logout()">Salir</a>
        </nav>
    </aside>
    
    <main class="content">
        <h1>Gestión de Inventario</h1>
        
        <div class="inventory-controls">
            <input 
                type="text" 
                id="busquedaInventario"
                placeholder="Buscar por nombre o código..."
                onkeyup="buscarInventario()">
            
            <button class="btn-sync" onclick="syncProductos()">
                🔄 Actualizar desde farmacia
            </button>
        </div>
        <button class="btn-sync" onclick="abrirModalNuevoProducto()">
            ➕ Nuevo producto
        </button>        
        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Stock</th>
                    <th>Mínimo</th>
                    <th>Caducidad</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaInventario"></tbody>
        </table>        
    </main>
</div>


<script src="js/app.js"></script>
<script>
    cargarInventario();
</script>

</body>
</html>

<div id="modalEditarProducto" class="modal">
    <div class="modal-content">
      <h3>Editar producto</h3>
  
      <input type="number" id="editStock" placeholder="Stock">
      <input type="number" id="editStockMin" placeholder="Stock mínimo">
      <input type="date" id="editFecha">
      <input type="number" step="0.01" id="editPrecio" placeholder="Precio">
  
      <button onclick="guardarEdicionProducto()">Guardar</button>
      <button onclick="cerrarModalProducto()">Cancelar</button>
    </div>
  </div>

  <div id="modalNuevoProducto" class="modal">
    <div class="modal-content">
      <h3>Nuevo producto</h3>
  
      <input id="nuevoNombre" placeholder="Nombre del producto">
      <input id="nuevoCategoria" placeholder="Categoría">
      <input type="number" id="nuevoStock" placeholder="Stock">
      <input type="number" id="nuevoStock" min="0" placeholder="Stock">
        <input type="number" id="nuevoStockMin" min="0" placeholder="Stock mínimo">
        <input type="number" step="0.01" min="0" id="nuevoPrecio" placeholder="Precio">
      <input type="number" id="nuevoStockMin" placeholder="Stock mínimo">
      <input type="number" step="0.01" id="nuevoPrecio" placeholder="Precio">
      <input type="date" id="nuevoFecha">
  
      <button onclick="guardarNuevoProducto()">Guardar</button>
      <button onclick="cerrarModalNuevoProducto()">Cancelar</button>
    </div>
  </div>
