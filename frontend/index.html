<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SOLTEC | Acceso</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<body class="login-body">
<div class="login-container">
        <img src="assets/logo.png" alt="SOLTEC" class="login-logo">

        <h2>Acceso al sistema</h2>
        <p class="subtitle">Gestión inteligente de inventarios</p>

        <form id="loginForm">
            <div class="input-group">
                <label>Correo electrónico</label>
                <input type="email" id="correo" placeholder="usuario@farmacia.com" required>
            </div>

            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">
                Ingresar
            </button>
        </form>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
